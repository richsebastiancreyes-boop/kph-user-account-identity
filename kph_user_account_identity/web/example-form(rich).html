<main id="main" class="container">
  <h2 class="section-title">New promotion</h2>
  <form id="form" class="card form" style="max-width:520px">
    <div class="field"><label for="n">Name</label><input id="n" name="PromotionName" required></div>
    <div class="field"><label for="s">Starts</label><input id="s" name="StartDate" type="datetime-local" required></div>
    <div class="field"><label for="e">Ends</label><input id="e" name="EndDate" type="datetime-local" required></div>
    <button class="btn" type="submit">Save promotion</button>
    <div id="msg" role="status"></div>
  </form>

</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/kph-ui.js"></script>
<script>
  // Sends the form to your API. The API's own message is shown when the backend rejects the data.
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    const body = Object.fromEntries(new FormData(e.target));
    body.StartDate = body.StartDate.replace("T", " ") + ":00";
    body.EndDate = body.EndDate.replace("T", " ") + ":00";
    try {
      const result = await apiSend("POST", "/promotions.php", body);
      msg.className = "alert alert-ok";
      msg.textContent = "Saved. Promotion number " + result.PromotionID + ".";
      e.target.reset();
    } catch (err) {
      msg.className = "alert alert-error";
      msg.textContent = err.message;
    }
  });
</script>
</body>
